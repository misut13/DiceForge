<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiceForge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" id="backBtn" style="display: none;" aria-label="Zurück"></button>
            <button class="settings-btn" id="settingsBtn" style="display: none;" aria-label="Einstellungen"></button>
            <h1 id="headerTitle">DiceForge</h1>
            <div class="subtitle" id="headerSubtitle"></div>
        </div>

        <!-- Profile List Screen -->
        <div class="screen active" id="profileListScreen">
            <div class="profile-list" id="profileList">
                <div class="empty-state">
                    <div class="icon">🎲</div>
                    <h3>Keine Profile vorhanden</h3>
                    <p>Erstellen Sie Ihr erstes Charakterprofil</p>
                </div>
            </div>
            <button class="btn btn-wood" id="createNewProfileBtn">Neues Profil erstellen</button>
        </div>

        <!-- Create Profile Screen -->
        <div class="screen" id="createProfileScreen">
            <h2>Neues Profil erstellen</h2>
            <div class="input-group">
                <label for="profileName">Profilname:</label>
                <input type="text" id="profileName" placeholder="z.B. Gandalf der Graue" maxlength="24">
            </div>
            <button class="btn btn-secondary" id="createProfileBtn">Profil erstellen</button>
            <button class="btn btn-secondary" id="cancelCreateProfileBtn">Abbrechen</button>
        </div>

        <!-- Profile Detail Screen -->
        <div class="screen" id="profileDetailScreen">
            <div id="profileContent">
                <div id="diceFunctions">
                    <div id="attackFunctionsList"></div>
                    <div id="diceFunctionsList"></div>
                </div>

                <div id="simpleDices">
                    <div id="simpleDicesList"></div>
                </div>
            </div>

            <div id="settingsOverlay" class="settings-overlay">
                <div class="settings-panel">
                    <button class="btn btn-wood" id="addAttackFunctionBtn">Angriffsfunktion hinzufügen</button>
                    <button class="btn btn-wood" id="addDiceFunctionBtn">Würfelfunktion hinzufügen</button>
                    <button class="btn btn-wood" id="addSimpleDiceBtn">Einfachen Würfel hinzufügen</button>
                    <button class="btn btn-wood" id="toggleAnimationBtn" aria-pressed="true">Animation ausschalten</button>
                    <button class="btn btn-danger" id="deleteModeBtn">Löschen</button>
                </div>
            </div>
        </div>

        <!-- Add Dice Function Screen -->
        <div class="screen" id="addDiceFunctionScreen">
            <h2>Würfelfunktion hinzufügen</h2>
            <div class="input-group">
                <label for="functionName">Name:</label>
                <input type="text" id="functionName" placeholder="z.B. Feuerball Schaden" maxlength="26">
            </div>
            <div class="input-group">
                <label for="functionFormula">Formel:</label>
                <input type="text" id="functionFormula" placeholder="z.B. 3w6+3" maxlength="20">
                <small>Format: Kombinationen wie 3w6+3 oder 3w6+3+2w6-2</small>
            </div>
            <button class="btn btn-secondary" id="saveDiceFunctionBtn">Hinzufügen</button>
            <button class="btn btn-secondary" id="cancelDiceFunctionBtn">Abbrechen</button>
        </div>

        <!-- Add Simple Dice Screen -->
        <div class="screen" id="addSimpleDiceScreen">
            <h2>Einfachen Würfel hinzufügen</h2>
            <div class="input-group">
                <label for="diceType">Würfeltyp:</label>
                <select id="diceType">
                    <option value="3">W3</option>
                    <option value="4">W4</option>
                    <option value="6">W6</option>
                    <option value="8">W8</option>
                    <option value="10">W10</option>
                    <option value="12">W12</option>
                    <option value="20">W20</option>
                    <option value="100">W100</option>
                    <option value="custom">Individueller Würfel</option>
                </select>
                <input type="text" id="customDiceSides" placeholder="Seitenanzahl" style="display:none;" inputmode="numeric" pattern="\d*" maxlength="5">
            </div>
            <button class="btn btn-secondary" id="saveSimpleDiceBtn">Hinzufügen</button>
            <button class="btn btn-secondary" id="cancelSimpleDiceBtn">Abbrechen</button>
        </div>
        <!-- Add Attack Function Screen -->
        <div class="screen" id="addAttackFunctionScreen">
            <h2><strong>Angriffsfunktion hinzufügen</strong></h2>
            <div class="input-group">
                <label for="attackFunctionName">Name:</label>
                <input type="text" id="attackFunctionName" placeholder="z.B. Schwerthieb" maxlength="26">
            </div>
            <div class="input-group">
                <label for="attackFunctionAttack">Angriffswurf:</label>
                <input type="text" id="attackFunctionAttack" placeholder="z.B. 1w20+5" maxlength="20">
            </div>
            <div class="input-group">
                <label for="attackFunctionDamage">Schadenswurf:</label>
                <input type="text" id="attackFunctionDamage" placeholder="z.B. 2w4+1" maxlength="20">
            </div>
            <button class="btn btn-secondary" id="saveAttackFunctionBtn">Hinzufügen</button>
            <button class="btn btn-secondary" id="cancelAttackFunctionBtn">Abbrechen</button>
        </div>
        <div id="diceAnimationOverlay" class="dice-animation-overlay" aria-hidden="true">
            <div class="dice-animation-container">
                <img id="diceAnimationImage" class="dice-animation-image" src="" alt="Würfel Animation">
            </div>
        </div>
        <div id="lastRollBar" class="result-popup" style="display:none;">
            <div class="popup-content">
                <div id="lastRollText"></div>
                <button class="btn btn-secondary" id="closeResultBtn">Schliessen</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
